<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TritonAI Harness Editing and Publishing Workflow | Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --triton-navy: #182b49;
  --triton-blue: #00629b;
  --triton-gold: #ffcd00;
  --triton-border: #d5d9de;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
}

body {
  background: #fff;
  color: var(--triton-navy);
  font-family: Roboto, Arial, Helvetica, sans-serif;
  overflow: hidden;
}

.deck {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.viewport {
  align-items: center;
  display: flex;
  flex: 1;
  justify-content: center;
  min-height: 0;
  overflow: auto;
  padding: clamp(12px, 2vw, 28px);
}

.video-only {
  display: grid;
  gap: clamp(12px, 1.5vw, 22px);
  grid-template-rows: minmax(0, 1fr) auto;
  margin: auto;
  max-width: 1600px;
  width: 100%;
}

.video-only video {
  background: #000;
  border-radius: 4px;
  box-shadow: 0 8px 24px rgba(24, 43, 73, .16);
  display: block;
  max-height: calc(100vh - 220px);
  object-fit: contain;
  width: 100%;
}

.video-transcript {
  color: var(--triton-navy);
  font-size: clamp(18px, 2vw, 28px);
  font-weight: 500;
  line-height: 1.4;
  margin: 0 auto;
  max-width: 1200px;
  min-height: 2.8em;
  text-align: center;
}

.controls {
  align-items: center;
  background: var(--triton-navy);
  color: #fff;
  display: flex;
  flex-shrink: 0;
  gap: 18px;
  height: 54px;
  justify-content: space-between;
  padding: 0 28px;
}

.controls-left {
  align-items: center;
  display: flex;
  gap: 10px;
}

.nav-btn {
  align-items: center;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, .55);
  border-radius: 4px;
  color: #fff;
  display: inline-flex;
  font-size: 24px;
  height: 34px;
  justify-content: center;
  line-height: 1;
  width: 40px;
}

.nav-btn:focus-visible {
  outline: 3px solid var(--triton-gold);
  outline-offset: 2px;
}

.nav-btn:disabled {
  cursor: default;
  opacity: .42;
}

.progress-text {
  font-size: 13px;
  letter-spacing: .03em;
  white-space: nowrap;
}

.progress-bar {
  background: rgba(255, 255, 255, .25);
  flex: 1;
  height: 4px;
  max-width: 540px;
}

.progress-fill {
  background: var(--triton-gold);
  height: 100%;
  width: 100%;
}

.site-footer {
  background: var(--triton-blue);
  flex-shrink: 0;
  height: 10px;
}

.sr-only {
  border: 0;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  height: 1px;
  margin: -1px;
  overflow: hidden;
  padding: 0;
  position: absolute;
  white-space: nowrap;
  width: 1px;
}

h1.sr-only {
  font-family: Teko-SemiBold, sans-serif;
}

@media (max-width: 640px) {
  .viewport {
    padding: 10px;
  }

  .video-only {
    gap: 12px;
  }

  .video-transcript {
    font-size: 18px;
    min-height: 4.2em;
  }

  .controls {
    gap: 10px;
    padding: 0 12px;
  }

  .controls-right {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="deck">
  <main class="viewport" id="viewport">
    <h1 class="sr-only">TritonAI Harness editing and publishing workflow</h1>
    <figure class="video-only">
      <video controls muted playsinline preload="metadata" poster="_resources/tritonai-harness-editing-demo-poster.jpg" aria-describedby="harness-demo-caption" data-silent-demo="true" data-caption-src="_resources/tritonai-harness-editing-publishing-demo.vtt" data-caption-target="harness-demo-caption">
        <source src="_resources/tritonai-harness-editing-publishing-demo.mp4" type="video/mp4">
        Your browser does not support embedded video.
      </video>
      <figcaption class="video-transcript" id="harness-demo-caption" aria-live="polite" aria-atomic="true">
        <span class="video-transcript-text">The TritonAI Harness shows files on the left, the update request in the center, and the private preview on the right.</span>
      </figcaption>
    </figure>
  </main>

  <nav class="controls" aria-label="Presentation navigation">
    <div class="controls-left">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous slide" disabled>‹</button>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next slide" disabled>›</button>
      <span class="progress-text" id="slideCounter">1 / 1</span>
    </div>
    <div class="progress-bar" aria-hidden="true"><div class="progress-fill"></div></div>
    <div class="controls-right">
      <span class="progress-text">F for fullscreen</span>
    </div>
  </nav>

  <footer class="site-footer" aria-hidden="true"></footer>
</div>

<script>
(function() {
  const video = document.querySelector('video[data-caption-src]');
  const target = document.getElementById(video?.dataset.captionTarget || '');
  const textNode = target?.querySelector('.video-transcript-text');

  const parseVttTime = (value) => {
    const parts = value.trim().split(':').map(Number);
    if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
    return (parts[0] * 60) + parts[1];
  };

  const loadTranscript = async () => {
    if (!video || !textNode) return;

    try {
      const response = await fetch(video.dataset.captionSrc);
      if (!response.ok) throw new Error('Caption transcript unavailable');
      const blocks = (await response.text()).replace(/\r/g, '').split(/\n{2,}/);
      const cues = blocks.flatMap((block) => {
        const lines = block.trim().split('\n');
        const timingIndex = lines.findIndex((line) => line.includes('-->'));
        if (timingIndex < 0) return [];
        const [startRaw, endRaw] = lines[timingIndex]
          .split('-->')
          .map((part) => part.trim().split(/\s+/)[0]);
        return [{
          start: parseVttTime(startRaw),
          end: parseVttTime(endRaw),
          text: lines.slice(timingIndex + 1).join(' ').trim()
        }];
      });
      const firstCue = cues[0]?.text || textNode.textContent;
      let lastText = '';

      const renderTranscript = () => {
        const cue = cues.find((item) => video.currentTime >= item.start && video.currentTime < item.end);
        const nextText = cue?.text || firstCue;
        if (nextText !== lastText) {
          textNode.textContent = nextText;
          lastText = nextText;
        }
      };

      ['loadedmetadata', 'timeupdate', 'seeked', 'play', 'pause', 'ended'].forEach((eventName) => {
        video.addEventListener(eventName, renderTranscript);
      });
      renderTranscript();
    } catch {
      textNode.textContent = 'Timed transcription is unavailable.';
    }
  };

  document.addEventListener('keydown', (event) => {
    if ((event.key === 'f' || event.key === 'F') && !(event.target instanceof Element && event.target.closest('video, button, a, input, select, textarea'))) {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
  });

  loadTranscript();
})();
</script>
</body>
</html>
