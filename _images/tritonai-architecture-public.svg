<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TritonAI architecture</title>
  <desc id="desc">A campus need moves through an approved TritonAI gateway to approved models, knowledge, and tools, with human review surrounding the workflow.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00629b"/>
      <stop offset="1" stop-color="#00c6d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#182b49" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="24" fill="#f5f0e6"/>
  <path d="M0 530C210 455 390 610 620 530s390-10 580-100v245H0z" fill="#c6e9ef"/>
  <path d="M0 585c225-70 390 70 620 8s395-25 580-90v172H0z" fill="#00c6d7" opacity=".7"/>
  <path d="M0 630c250-45 440 38 690-10s360-35 510-72v127H0z" fill="#00629b"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#182b49">
    <text x="60" y="76" font-size="28" font-weight="700" letter-spacing="3">TRITONAI ARCHITECTURE</text>
    <text x="60" y="112" font-size="21">One governed route from a campus need to an accountable service</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="190" width="220" height="190" rx="18" fill="#fff"/>
    <rect x="335" y="155" width="250" height="260" rx="22" fill="url(#ocean)"/>
    <rect x="645" y="140" width="245" height="105" rx="18" fill="#fff"/>
    <rect x="645" y="260" width="245" height="105" rx="18" fill="#fff"/>
    <rect x="645" y="380" width="245" height="105" rx="18" fill="#fff"/>
    <rect x="950" y="190" width="200" height="190" rx="18" fill="#fff"/>
  </g>

  <g stroke="#00629b" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M275 285h45"/>
    <path d="M585 285h45"/>
    <path d="M890 285h45"/>
  </g>
  <g fill="#00629b">
    <path d="m320 285-18-12v24z"/>
    <path d="m630 285-18-12v24z"/>
    <path d="m935 285-18-12v24z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="165" cy="245" r="34" fill="#ffcd00"/>
    <path d="M145 300h40m-20-20v40" stroke="#182b49" stroke-width="9" stroke-linecap="round"/>
    <text x="165" y="351" fill="#182b49" font-size="24" font-weight="700">Campus need</text>

    <circle cx="460" cy="225" r="44" fill="#fff" opacity=".96"/>
    <path d="M437 225h46M460 202v46" stroke="#00629b" stroke-width="10" stroke-linecap="round"/>
    <text x="460" y="310" fill="#fff" font-size="28" font-weight="700">TritonAI gateway</text>
    <text x="460" y="343" fill="#fff" font-size="19">identity · routing · policy</text>

    <text x="767" y="185" fill="#182b49" font-size="23" font-weight="700">Approved models</text>
    <text x="767" y="216" fill="#46535f" font-size="18">chosen for the task</text>
    <text x="767" y="305" fill="#182b49" font-size="23" font-weight="700">Approved knowledge</text>
    <text x="767" y="336" fill="#46535f" font-size="18">grounded at request time</text>
    <text x="767" y="425" fill="#182b49" font-size="23" font-weight="700">Approved tools</text>
    <text x="767" y="456" fill="#46535f" font-size="18">bounded capabilities</text>

    <circle cx="1050" cy="245" r="34" fill="#00c6d7"/>
    <path d="m1032 246 13 13 26-31" stroke="#182b49" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="321" fill="#182b49" font-size="24" font-weight="700">Human review</text>
    <text x="1050" y="350" fill="#46535f" font-size="18">ownership · evidence</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="340" y="520" width="520" height="75" rx="38" fill="#182b49"/>
    <text x="600" y="551" fill="#fff" font-size="18" font-weight="700" letter-spacing="1.5">EVALUATION · ACCESSIBILITY · MONITORING</text>
    <text x="600" y="578" fill="#fff" font-size="17">Controls and accountability surround the full service</text>
  </g>
</svg>
