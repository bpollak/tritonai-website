<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc">
  <title id="title">TritonGPT request architecture for mobile screens</title>
  <desc id="desc">A user signs in to TritonGPT with a UC San Diego account. TritonGPT sends the request through the TritonAI LLM Gateway. When the task calls for them and access allows, the request can include the user's files, approved campus sources, or bounded assistant tools. The gateway sends the prepared request to an approved enterprise cloud or SDSC-hosted model. The response returns to TritonGPT for the user to review.</desc>
  <defs>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00629b"/>
      <stop offset="1" stop-color="#00a6b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#182b49" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 5 0 10z" fill="#00629b"/>
    </marker>
  </defs>

  <rect width="390" height="1160" rx="18" fill="#f5f0e6"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#182b49">
    <text x="22" y="42" font-size="22" font-weight="700" letter-spacing="1">TRITONGPT REQUEST</text>
    <text x="22" y="68" font-size="22" font-weight="700" letter-spacing="1">ARCHITECTURE</text>
    <text x="22" y="96" font-size="16">From campus sign-in to a response you review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="125" width="340" height="105" rx="16" fill="#fff"/>
    <rect x="25" y="260" width="340" height="110" rx="16" fill="#fff"/>
    <rect x="25" y="400" width="340" height="120" rx="18" fill="url(#gateway)"/>
  </g>

  <g fill="none" stroke="#00629b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M195 230v22"/>
    <path d="M195 370v22"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="70" cy="177" r="24" fill="#ffcd00"/>
    <path d="M55 215h30m-15-15v30" fill="none" stroke="#182b49" stroke-width="7" stroke-linecap="round"/>
    <text x="112" y="171" fill="#182b49" font-size="20" font-weight="700">You sign in</text>
    <text x="112" y="197" fill="#46535f" font-size="16">UC San Diego account</text>

    <rect x="45" y="288" width="62" height="48" rx="12" fill="#e7f3f8"/>
    <path d="M59 300h34v22H59z" fill="none" stroke="#00629b" stroke-width="4"/>
    <path d="M67 334h18" fill="none" stroke="#00629b" stroke-width="4" stroke-linecap="round"/>
    <text x="127" y="301" fill="#182b49" font-size="21" font-weight="700">TritonGPT</text>
    <text x="127" y="327" fill="#46535f" font-size="16">Chat · documents · assistants</text>

    <circle cx="74" cy="460" r="28" fill="#fff" opacity=".96"/>
    <path d="M58 460h32m-16-16v32" fill="none" stroke="#00629b" stroke-width="7" stroke-linecap="round"/>
    <text x="122" y="448" fill="#fff" font-size="21" font-weight="700">TritonAI LLM Gateway</text>
    <text x="122" y="478" fill="#fff" font-size="16">Identity · policy · routing</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="25" y="558" fill="#182b49" font-size="17" font-weight="700">Included only when needed and allowed</text>
    <g filter="url(#shadow)">
      <rect x="25" y="578" width="105" height="85" rx="14" fill="#fff"/>
      <rect x="142" y="578" width="106" height="85" rx="14" fill="#fff"/>
      <rect x="260" y="578" width="105" height="85" rx="14" fill="#fff"/>
    </g>
    <text x="77" y="612" fill="#182b49" font-size="17" font-weight="700" text-anchor="middle">Your files</text>
    <text x="77" y="638" fill="#46535f" font-size="16" text-anchor="middle">You provide</text>
    <text x="195" y="608" fill="#182b49" font-size="17" font-weight="700" text-anchor="middle">Campus</text>
    <text x="195" y="630" fill="#182b49" font-size="17" font-weight="700" text-anchor="middle">sources</text>
    <text x="195" y="650" fill="#46535f" font-size="16" text-anchor="middle">Approved</text>
    <text x="312" y="608" fill="#182b49" font-size="17" font-weight="700" text-anchor="middle">Assistant</text>
    <text x="312" y="630" fill="#182b49" font-size="17" font-weight="700" text-anchor="middle">tools</text>
    <text x="312" y="650" fill="#46535f" font-size="16" text-anchor="middle">Bounded</text>
  </g>

  <g fill="none" stroke="#00629b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M195 675v28"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="25" y="715" width="340" height="115" rx="16" fill="#fff"/>
    <rect x="25" y="865" width="340" height="115" rx="16" fill="#fff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="74" cy="772" r="26" fill="#e7f3f8"/>
    <path d="M58 773h32m-27-10 7-7m15 7-7-7m-15 24 7 7m15-7-7 7" fill="none" stroke="#00629b" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="758" fill="#182b49" font-size="20" font-weight="700">Approved model route</text>
    <text x="120" y="785" fill="#46535f" font-size="16">Enterprise cloud or SDSC-hosted</text>

    <circle cx="74" cy="922" r="26" fill="#00c6d7"/>
    <path d="m61 922 10 10 19-23" fill="none" stroke="#182b49" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="908" fill="#182b49" font-size="20" font-weight="700">Response in TritonGPT</text>
    <text x="120" y="935" fill="#46535f" font-size="16">You review before use</text>
  </g>

  <g fill="none" stroke="#00629b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M195 830v27"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="25" y="1020" width="340" height="105" rx="17" fill="#182b49"/>
    <text x="45" y="1053" fill="#ffcd00" font-size="16" font-weight="700" letter-spacing=".8">CONTROLS ACROSS THE REQUEST</text>
    <text x="45" y="1080" fill="#fff" font-size="16">Privacy · security · accessibility</text>
    <text x="45" y="1104" fill="#fff" font-size="16">Evaluation · monitoring · named owner</text>
  </g>
</svg>
