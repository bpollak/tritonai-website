name: Validate and deploy GitHub Pages

# GitHub Pages is the playground: the lowest rung, safe to break, not campus
# facing. It publishes from the `playground` branch only.
#
# It deliberately does NOT publish from main. Deploying main here is how changes
# reached a live URL without anyone choosing to release them. The Cascade
# workflow owns the real destinations: preview -> Stage, main -> Production.
#
# The hourly run stays, but validates without deploying. Scheduled workflows can
# only ever run on the default branch, so a scheduled deploy would overwrite the
# playground with main's content within the hour — the exact behaviour being
# removed. It still catches a dead CDN dependency or content going stale on main.
on:
  pull_request:
  push:
    branches:
      - playground
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - skills-library-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Refresh UCSD Skills Library catalog
        env:
          SKILLS_GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:skills

      - name: Build project Pages site
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Validate routes and integrations
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run validate

      - name: Check copy against the voice guide
        run: npm run test:language

      - name: Run site-wide accessibility checks
        run: npm run test:a11y

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-${{ github.run_id }}
          path: reports/accessibility.json
          retention-days: 30
          if-no-files-found: error

      # Match the deploy job's condition. The scheduled run validates only, so
      # building it an artifact nothing consumes is wasted work.
      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only a playground push deploys. Pull requests validate, and the schedule
    # validates main without republishing over the playground.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
