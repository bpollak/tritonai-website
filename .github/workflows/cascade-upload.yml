name: Publish to Cascade

# Runs automatically on merge to main, once per day for Skills Library
# updates, or when the Skills Library sends its repository event. The values
# below in `env` are the single source of truth; the workflow_dispatch inputs
# are optional overrides for one-off runs (for example pointing at a scratch
# folder or a different instance) and are deliberately left without defaults
# so they fall through to `env` when blank.
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 13 * * *'
  repository_dispatch:
    types:
      - skills-library-updated
  workflow_dispatch:
    inputs:
      site_name:
        description: 'Override site name (blank uses the workflow default)'
        required: false
      root_path:
        description: 'Override target folder (blank uses the workflow default)'
        required: false
      base_url:
        description: 'Override Cascade host (blank uses the workflow default)'
        required: false
      publish_id:
        description: 'Override publish target asset id (blank uses the workflow default)'
        required: false
      skip_publish:
        description: 'Upload without publishing'
        required: false
        type: boolean
        default: false

env:
  # Change these to retarget the pipeline. Everything else reads from here.
  CASCADE_SITE: ${{ inputs.site_name || 'TritonAI' }}
  CASCADE_ROOT: ${{ inputs.root_path || '/' }}
  CASCADE_HOST: ${{ inputs.base_url || 'https://ucsd.cascadecms.com' }}
  # Root folder of TritonAI-Test on ucsd-dev. Asset ids are per instance:
  # a prod root will have a different id.
  CASCADE_PUBLISH_ID: ${{ inputs.publish_id || '1b1cf53b0aaf69f5520d3d68d7e754fe' }}

# One deploy at a time. Queued rather than cancelled, so a run that is
# already writing to Cascade is never interrupted part way through.
concurrency:
  group: cascade-publish
  cancel-in-progress: false

jobs:
  build:
    name: Refresh, build and plan
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release_gate.outputs.should_deploy }}
      skills_commit: ${{ steps.release_gate.outputs.skills_commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Refresh UCSD Skills Library catalog
        env:
          SKILLS_GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:skills

      - name: Decide whether production needs an update
        id: release_gate
        env:
          LIVE_SKILLS_URL: https://tritonai.ucsd.edu/skills/index.html
        run: node scripts/skills-release-gate.mjs

      # Empty SITE_BASE_PATH is required. GitHub Pages builds with
      # /tritonai-website, which would prefix every route and break every
      # link once uploaded to a Cascade site root.
      - name: Build and validate
        if: steps.release_gate.outputs.should_deploy == 'true'
        env:
          SITE_BASE_PATH: ''
        run: |
          npm run build
          npm run validate

      - name: Fail if base path leaked into the build
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: |
          if grep -rl '/tritonai-website' dist >/dev/null 2>&1; then
            echo "::error::dist contains /tritonai-website; SITE_BASE_PATH was not empty"
            grep -rl '/tritonai-website' dist | head -20
            exit 1
          fi
          echo "Base path clean. dist contains $(find dist -type f | wc -l) files."

      - uses: actions/setup-python@v5
        if: steps.release_gate.outputs.should_deploy == 'true'
        with:
          python-version: '3.11'

      - if: steps.release_gate.outputs.should_deploy == 'true'
        run: pip install requests urllib3

      - name: Dry-run upload
        if: steps.release_gate.outputs.should_deploy == 'true'
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          echo "Target: $CASCADE_SITE $CASCADE_ROOT on $CASCADE_HOST"
          python scripts/cascade_uploader.py ./dist \
            --site-name "$CASCADE_SITE" \
            --root-path "$CASCADE_ROOT" \
            --base-url "$CASCADE_HOST" \
            2>&1 | tee dry-run.log

      # Deploy the exact bytes that were planned, rather than rebuilding and
      # hoping the second build matches the first.
      - uses: actions/upload-artifact@v4
        if: steps.release_gate.outputs.should_deploy == 'true'
        with:
          name: cascade-dist
          path: dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.release_gate.outputs.should_deploy == 'true' }}
        with:
          name: cascade-dry-run-log
          path: dry-run.log
          retention-days: 30

  deploy:
    name: Upload to Cascade
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: cascade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cascade-dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests urllib3

      - name: Live upload
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          python scripts/cascade_uploader.py ./dist \
            --site-name "$CASCADE_SITE" \
            --root-path "$CASCADE_ROOT" \
            --base-url "$CASCADE_HOST" \
            --no-dry-run \
            2>&1 | tee upload.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cascade-upload-log
          path: upload.log
          retention-days: 30

  publish:
    name: Publish
    needs: [build, deploy]
    # Runs on every automatic deploy. Tick skip_publish on a manual run to
    # upload without publishing.
    if: needs.build.outputs.should_deploy == 'true' && inputs.skip_publish != true
    runs-on: ubuntu-latest
    environment: cascade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests urllib3

      # No directory is walked here: the upload already happened. The empty
      # directory just satisfies the required argument.
      - name: Queue publish
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          mkdir -p empty
          python scripts/cascade_uploader.py ./empty \
            --site-name "$CASCADE_SITE" \
            --root-path "$CASCADE_ROOT" \
            --base-url "$CASCADE_HOST" \
            --no-dry-run \
            --publish \
            --publish-id "$CASCADE_PUBLISH_ID" \
            --publish-type folder
          echo "Queued, not finished. Watch the publish queue in Cascade."
