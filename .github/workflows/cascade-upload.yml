name: Publish to Cascade

# main    -> publishes to the Production destination
# preview -> publishes to the Stage destination
#
# Both branches upload to the SAME content tree in Cascade. Only the publish
# destination differs. See the note in the config job.
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which destination to publish to'
        required: false
        type: choice
        options: ['', 'main', 'preview']
        default: ''
      site_name:
        description: 'Override site name'
        required: false
      root_path:
        description: 'Override target folder'
        required: false
      base_url:
        description: 'Override Cascade host'
        required: false
      publish_id:
        description: 'Override publish target asset id'
        required: false
      destination_id:
        description: 'Override Cascade destination id'
        required: false
      skip_publish:
        description: 'Upload without publishing'
        required: false
        type: boolean
        default: false

# Queue per target so a main deploy and a preview deploy never block each
# other, but two deploys to the same target never overlap.
concurrency:
  group: cascade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.resolve.outputs.site }}
      root: ${{ steps.resolve.outputs.root }}
      host: ${{ steps.resolve.outputs.host }}
      publish_id: ${{ steps.resolve.outputs.publish_id }}
      destination_id: ${{ steps.resolve.outputs.destination_id }}
      environment: ${{ steps.resolve.outputs.environment }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - id: resolve
        env:
          IN_TARGET: ${{ inputs.target }}
          IN_SITE: ${{ inputs.site_name }}
          IN_ROOT: ${{ inputs.root_path }}
          IN_HOST: ${{ inputs.base_url }}
          IN_PUBLISH: ${{ inputs.publish_id }}
          IN_DEST: ${{ inputs.destination_id }}
        run: |
          # Branch decides the destination unless a manual run names one.
          target="$IN_TARGET"
          if [ -z "$target" ]; then
            case "${{ github.ref }}" in
              refs/heads/preview) target=preview ;;
              refs/heads/main)    target=main ;;
              *) echo "::error::No target mapped for ${{ github.ref }}"; exit 1 ;;
            esac
          fi

          # Shared for every target: one server, one site, one content tree.
          host='https://ucsd.cascadecms.com'
          site='TritonAI'
          root='/'
          publish_id='1b1cf53b0aaf69f5520d3d68d7e754fe'

          # ---- Only the publish destination differs. ----
          case "$target" in
            main)
              destination_id='1b1d1f4f0aaf69f5520d3d68a0c21f0e'   # Production
              environment='cascade-prod'
              ;;
            preview)
              destination_id='1b1d1f300aaf69f5520d3d682aa44c68'   # Stage
              environment='cascade-preview'
              ;;
            *)
              echo "::error::Unknown target: $target"; exit 1 ;;
          esac
          # -----------------------------------------------

          # Manual overrides win over the defaults above.
          if [ -n "$IN_SITE" ];    then site="$IN_SITE"; fi
          if [ -n "$IN_ROOT" ];    then root="$IN_ROOT"; fi
          if [ -n "$IN_HOST" ];    then host="$IN_HOST"; fi
          if [ -n "$IN_PUBLISH" ]; then publish_id="$IN_PUBLISH"; fi
          if [ -n "$IN_DEST" ];    then destination_id="$IN_DEST"; fi

          case "$site$publish_id" in
            *REPLACE*)
              echo "::error::Workflow still has placeholder values for site or root folder id"
              exit 1 ;;
          esac

          {
            echo "site=$site"
            echo "root=$root"
            echo "host=$host"
            echo "publish_id=$publish_id"
            echo "destination_id=$destination_id"
            echo "environment=$environment"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

          echo "Target:      $target"
          echo "Site:        $site $root on $host"
          echo "Destination: $destination_id"
          echo "Environment: $environment"

  build:
    name: Build and plan
    needs: config
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.release_gate.outputs.should_deploy }}
      skills_commit: ${{ steps.release_gate.outputs.skills_commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Refresh UCSD Skills Library catalog
        env:
          SKILLS_GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:skills

      - name: Decide whether production needs an update
        id: release_gate
        env:
          LIVE_SKILLS_URL: https://tritonai.ucsd.edu/skills/index.html
        run: node scripts/skills-release-gate.mjs

      # Empty SITE_BASE_PATH is required. GitHub Pages builds with
      # /tritonai-website, which would prefix every route and break every
      # link once uploaded to a Cascade site root.
      - name: Check language, build and validate
        if: steps.release_gate.outputs.should_deploy == 'true'
        env:
          SITE_BASE_PATH: ''
        run: |
          npm run test:language
          npm run build
          npm run validate

      - name: Fail if base path leaked into the build
        if: steps.release_gate.outputs.should_deploy == 'true'
        run: |
          if grep -rl '/tritonai-website' dist >/dev/null 2>&1; then
            echo "::error::dist contains /tritonai-website; SITE_BASE_PATH was not empty"
            grep -rl '/tritonai-website' dist | head -20
            exit 1
          fi
          echo "Base path clean. dist contains $(find dist -type f | wc -l) files."

      - uses: actions/setup-python@v5
        if: steps.release_gate.outputs.should_deploy == 'true'
        with:
          python-version: '3.11'

      - if: steps.release_gate.outputs.should_deploy == 'true'
        run: pip install requests urllib3

      - name: Dry-run upload
        if: steps.release_gate.outputs.should_deploy == 'true'
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          python scripts/cascade_uploader.py ./dist \
            --site-name "${{ needs.config.outputs.site }}" \
            --root-path "${{ needs.config.outputs.root }}" \
            --base-url "${{ needs.config.outputs.host }}" \
            2>&1 | tee dry-run.log

      # Deploy the exact bytes that were planned, rather than rebuilding and
      # hoping the second build matches the first.
      - uses: actions/upload-artifact@v4
        if: steps.release_gate.outputs.should_deploy == 'true'
        with:
          name: cascade-dist
          path: dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.release_gate.outputs.should_deploy == 'true' }}
        with:
          name: cascade-dry-run-log
          path: dry-run.log
          retention-days: 30

  deploy:
    name: Upload to Cascade
    needs: [config, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cascade-dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests urllib3

      - name: Live upload
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          python scripts/cascade_uploader.py ./dist \
            --site-name "${{ needs.config.outputs.site }}" \
            --root-path "${{ needs.config.outputs.root }}" \
            --base-url "${{ needs.config.outputs.host }}" \
            --no-dry-run \
            2>&1 | tee upload.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cascade-upload-log
          path: upload.log
          retention-days: 30

  publish:
    name: Publish
    needs: [config, deploy]
    if: inputs.skip_publish != true
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests urllib3

      # No directory is walked here: the upload already happened. The empty
      # directory just satisfies the required argument.
      - name: Queue publish
        env:
          CASCADE_API_KEY: ${{ secrets.CASCADE_API_KEY }}
        run: |
          test -n "$CASCADE_API_KEY" || { echo "::error::CASCADE_API_KEY not set"; exit 1; }
          mkdir -p empty
          python scripts/cascade_uploader.py ./empty \
            --site-name "${{ needs.config.outputs.site }}" \
            --root-path "${{ needs.config.outputs.root }}" \
            --base-url "${{ needs.config.outputs.host }}" \
            --no-dry-run \
            --publish \
            --publish-id "${{ needs.config.outputs.publish_id }}" \
            --publish-type folder \
            --destination-id "${{ needs.config.outputs.destination_id }}"
          echo "Queued, not finished. Watch the publish queue in Cascade."
